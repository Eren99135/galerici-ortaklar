<script>
// Ilan listesi ekranina dogrudan duser: sanayiden.com bandi ve satirlar gorunur.
window.addEventListener("load", function () {
  var s = G.durum.yeniOyun(4242);
  G.olaylar.secenekSec(s, 0);
  s.ilanlar[1].kaynak = "kro";               // etiketli satir da gorunsun
  s.ilanlar[2].ilanYasi = 3;
  s.ekran = "ilanlar";
  G.ui.ciz();

  // #tasma ile acilirsa: goruntu alanindan tasan ogeleri ekrana yazar (mobil hata ayiklama)
  if (location.hash === "#tasma") {
    var en = document.documentElement.clientWidth;
    var liste = [], hepsi = document.querySelectorAll("*");
    for (var i = 0; i < hepsi.length; i++) {
      var k = hepsi[i].getBoundingClientRect();
      if (k.right > en + 1 || k.width > en + 1) {
        liste.push(hepsi[i].tagName.toLowerCase() + "." + (hepsi[i].className || "-") +
          "  sag:" + Math.round(k.right) + " en:" + Math.round(k.width));
      }
    }
    var kutu = document.createElement("pre");
    kutu.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:999;background:#fff;" +
      "color:#000;font:11px monospace;margin:0;padding:6px;max-height:60vh;overflow:hidden";
    var ns = String.fromCharCode(10);
    kutu.textContent = "goruntu alani: " + en + "px" + ns +
      (liste.length ? liste.join(ns) : "tasan oge yok");
    document.body.appendChild(kutu);
  }
});
</script>
</body>
</html>
