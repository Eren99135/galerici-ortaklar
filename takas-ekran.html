<script>
window.addEventListener("load", function () {
  var s = G.durum.yeniOyun(606);
  s.diyalog = null; s.aktifKart = null; s.aktifHikaye = null;
  s.rehber.acik = false;
  s.faz = "mesai"; s.aksiyon = 3;
  var araba = G.araba.ilanUret(s, "ilan", "durust");
  araba.alisFiyati = Math.round(araba.piyasaDegeri * 0.95);
  araba.masraflar = G.config.NOTER_PLAKA;
  araba.ilanFiyati = Math.round(araba.alisFiyati * 1.1);
  s.stok.push(araba);
  var m = G.musteri.musteriUret(s, araba);
  var hedef = (location.hash || "#takas").slice(1);
  if (hedef === "cek") {
    m.takasArabasi = null;
    G.cek.musteriyiCekciYap(s, m);
    m.cekRiski = "orta";
  } else {
    m.takasArabasi = G.takas.arabaUret(s);
    m.takasKapandi = false;
  }
  s.musteriler.push(m);
  G.pazarlik.satisBaslat(s, m.id, "soyle", "nuri");
  s.ekran = "satis";
  G.ui.ciz();
});
</script></body></html>
