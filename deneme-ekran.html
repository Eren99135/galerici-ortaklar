<script>
window.addEventListener("load", function () {
  var s = G.durum.yeniOyun(4242);
  G.olaylar.secenekSec(s, 0);
  var ilan = s.ilanlar[0];
  G.ekspertiz.gozKontrol(ilan);
  G.ekspertiz.ekspertizYap(s, ilan, "normal");
  G.pazarlik.alisBaslat(s, ilan.id, "nuri");
  G.pazarlik.alisTeklif(s, Math.round(ilan.istenenFiyat * 0.82 / 10000) * 10000);
  s.ekran = "pazarlik";
  G.ui.ciz();
});
</script>
